<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordle Wizard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=IM+Fell+Great+Primer:ital@0;1&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: one folio of a living grimoire. HUD on top, Brother Bryan's gloss, the board as the
   illuminated panel, the clue log, a row of niches for the charms, and the type case at the bottom.
   Pigments are the grades: malachite = in place, orpiment = elsewhere, ash = absent,
   lapis = "in the word" (Muddied Pigments curse), smoke stipple = color hidden.
   --chaos (0..1) lets a vermilion stain creep up the page and turns the rosette as curses pile up. */
:root {
  /* vellum by day */
  --bg: #ebe0c7;          /* the leaf */
  --bg-deep: #e0d1b0;     /* worn vellum: fog, claimed */
  --leaf: #f4ecd9;        /* fresh leaf: panels, bubbles */
  --ink: #26170e;         /* iron-gall ink */
  --ink-soft: #64503d;    /* faded ink: labels, secondary copy */
  --rule: #b29c76;        /* dry-point ruling, hairlines */
  --ruling: rgba(130, 98, 55, .16);
  --key: #ddcca7;
  --malachite: #2c7250;   /* correct */
  --orpiment: #dba526;    /* present */
  --ash: #8d7e6b;         /* absent */
  --lapis: #31539a;       /* hit, rare plates, counts */
  --vermilion: #b4341b;   /* curses, rubrics, seals */
  --verm-fill: #b4341b;   /* vermilion as a surface under cream letters */
  --mal-fill: #2c7250;    /* malachite as a surface under cream letters */
  --gilt: #9c6f14;        /* perks, legendary, ghost letters */
  --gilt-ink: #7a560c;    /* gilt as small text on vellum */
  --gilt-hi: #e2c068;     /* gold leaf surfaces */
  --on-deep: #f6eedb;     /* letters on malachite, ash, lapis, vermilion */
  --on-pale: #26170e;     /* letters on orpiment and gold leaf */
  --glow: rgba(255, 246, 220, .7);
  --veil: rgba(235, 224, 199, .88);
  --shadow: rgba(60, 35, 10, .18);
  --rosette: .36;
  /* the Underdrawing panel is always candlelit */
  --code-bg: #1d130c; --code-fg: #ecdcbb; --code-cm: #b59b76; --code-str: #dfb75e; --code-line: #3a2a1d;

  --display: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --text: "EB Garamond", Garamond, "Times New Roman", Georgia, serif;
  --letter: "IM Fell Great Primer", "IM Fell English", "EB Garamond", Georgia, serif;
  --italic: "IM Fell English", "EB Garamond", Georgia, serif;
  --label: "IM Fell English SC", "EB Garamond", Georgia, serif;
  --initial: "UnifrakturMaguntia", "IM Fell English", Georgia, serif;
  --tile: 50px;
  --chaos: 0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    /* candlelit night ink */
    --bg: #150d0a; --bg-deep: #24160f; --leaf: #1e130d; --ink: #ecdcbb; --ink-soft: #a88f6c;
    --rule: #57402c; --ruling: rgba(200, 150, 90, .09); --key: #33231a;
    --malachite: #3a9168; --orpiment: #e2b03c; --ash: #3c2c22; --lapis: #5479c9;
    --vermilion: #e05c3d; --gilt: #d9a948; --gilt-ink: #d9a948; --gilt-hi: #f5d98e;
    --verm-fill: #b8432a; --mal-fill: #2c7250;
    --on-deep: #f7ecd2; --on-pale: #1c1008;
    --glow: rgba(214, 120, 50, .26); --veil: rgba(21, 13, 10, .88); --shadow: rgba(0, 0, 0, .5); --rosette: .3;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150d0a; --bg-deep: #24160f; --leaf: #1e130d; --ink: #ecdcbb; --ink-soft: #a88f6c;
  --rule: #57402c; --ruling: rgba(200, 150, 90, .09); --key: #33231a;
  --malachite: #3a9168; --orpiment: #e2b03c; --ash: #3c2c22; --lapis: #5479c9;
  --vermilion: #e05c3d; --gilt: #d9a948; --gilt-ink: #d9a948; --gilt-hi: #f5d98e;
  --verm-fill: #b8432a; --mal-fill: #2c7250;
  --on-deep: #f7ecd2; --on-pale: #1c1008;
  --glow: rgba(214, 120, 50, .26); --veil: rgba(21, 13, 10, .88); --shadow: rgba(0, 0, 0, .5); --rosette: .3;
  color-scheme: dark;
}

[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
html, body { height: 100%; margin: 0; overflow-x: clip; }
body {
  /* lamplight from above, then the bare leaf */
  background:
    radial-gradient(120% 55% at 50% -8%, var(--glow), transparent 70%),
    var(--bg);
  color: var(--ink);
  font: 400 16px/1.35 var(--text);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-font-smoothing: antialiased;
}
/* the ruled frame of the text block, with prick marks down the outer margins */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    linear-gradient(to right, transparent 7px, var(--ruling) 7px 8px, transparent 8px calc(100% - 8px), var(--ruling) calc(100% - 8px) calc(100% - 7px), transparent calc(100% - 7px)),
    radial-gradient(circle, var(--ruling) 1px, transparent 1.6px) 2px 14px / 4px 34px repeat-y,
    radial-gradient(circle, var(--ruling) 1px, transparent 1.6px) calc(100% - 2px) 14px / 4px 34px repeat-y;
}
/* chaos: a vermilion stain rises from the foot of the page as curses pile up */
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(120% 60% at 50% 115%, color-mix(in srgb, var(--vermilion) calc(var(--chaos) * 30%), transparent), transparent 70%);
}
#app {
  position: relative; z-index: 1;
  height: 100%; max-width: 520px; margin: 0 auto; box-sizing: border-box;
  padding-inline: 16px; padding-block: 10px 8px;
  display: flex; flex-direction: column; gap: 7px;
}

/* ---------- header: drop-cap lockup + HUD ---------- */
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.logo { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: end; line-height: 1; color: var(--ink); flex: none; }
.logo .cap {
  grid-row: span 2; width: 34px; height: 34px; display: grid; place-items: center; padding-top: 2px; box-sizing: border-box;
  font: 400 27px/1 var(--initial); color: var(--on-deep); background: var(--verm-fill);
  box-shadow: inset 0 0 0 2px var(--vermilion), inset 0 0 0 3px var(--gilt-hi);
  transform: rotate(calc(var(--chaos) * -9deg)); transition: transform 1.2s ease;
}
.logo .l1 { font: 400 19px/1 var(--label); letter-spacing: .07em; align-self: end; transform: translateY(2px); }
.logo .l2 { font: italic 400 14px/1 var(--italic); color: var(--ink-soft); letter-spacing: .03em; align-self: start; padding-top: 3px; }
.hud { display: flex; align-items: flex-end; gap: 13px; min-width: 0; }
.stat { display: flex; align-items: center; line-height: 1; }
.stat b { font: 600 18px/1 var(--text); font-variant-numeric: lining-nums tabular-nums; height: 18px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.stat b i { font: italic 400 12px/1 var(--text); color: var(--ink-soft); margin-right: 1px; }
.seal { width: 15px; height: 15px; flex: none; }
.seal .wax { fill: var(--vermilion); }
.seal .mark { fill: none; stroke: var(--on-deep); stroke-width: 1.1; opacity: .8; }
#hSeals.fly { animation: fly .5s ease 2; }
@media (max-width: 400px) { .hud { gap: 9px; } .logo .l1 { font-size: 17px; } }

/* ---------- the margins: boons down the left, curses down the right; tap one for its note ---------- */
.rail {
  position: absolute; top: 0; bottom: 0; z-index: 2; width: 30px; box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 4px 2px 6px;
  overflow-y: auto; overflow-x: hidden; scrollbar-width: none; overscroll-behavior: contain;
}
.rail::-webkit-scrollbar { display: none; }
.rail.more { padding-bottom: 20px; scroll-padding-block-end: 26px; -webkit-mask-image: linear-gradient(#000 calc(100% - 24px), transparent); mask-image: linear-gradient(#000 calc(100% - 24px), transparent); }
#railB { left: 0; }
#railC { right: 0; }
.ico {
  flex: none; position: relative; width: 26px; height: 26px; box-sizing: border-box; padding: 0; margin: 0;
  display: grid; place-items: center; cursor: pointer; font: inherit;
  border: 1px solid var(--rule); border-radius: 3px; background: var(--leaf); color: var(--ink);
}
.ico svg { width: 18px; height: 18px; display: block; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.ico svg .fill { fill: currentColor; stroke: none; }
.ico .n {
  position: absolute; right: -2px; bottom: -5px; min-width: 14px; height: 14px; box-sizing: border-box; padding: 0 3px;
  border-radius: 52% 48% 56% 44% / 48% 55% 45% 52%; background: var(--ink); color: var(--bg);
  font: 600 10px/14px var(--text); text-align: center; font-variant-numeric: lining-nums;
}
/* a curse is a roundel in vermilion; a beast's, for this folio only, is filled */
.ico.curse { border-radius: 50%; color: var(--vermilion); border-color: color-mix(in srgb, var(--vermilion) 55%, transparent); background: color-mix(in srgb, var(--vermilion) 9%, var(--leaf)); }
.ico.curse .n { background: var(--vermilion); color: var(--on-deep); }
.ico.boss, .ico.beast { color: var(--on-deep); background: var(--verm-fill); border-color: var(--vermilion); }
.ico.beast { border-radius: 3px; }
.ico.feast { color: var(--on-pale); background: var(--gilt-hi); border-color: var(--gilt); }
.ico.held { border-style: dashed; background: var(--leaf); } .ico.held svg { opacity: .45; } /* held off for now */
.ico.new { animation: icoNew 1.2s ease 2; } /* a curse just written */
@keyframes icoNew { 0%, 50% { opacity: .3; transform: scale(1.15); } 25%, 75%, 100% { opacity: 1; transform: none; } }
/* a boon is a little plate, coloured like its card */
.ico.boon.r-rare { color: var(--lapis); border-color: color-mix(in srgb, var(--lapis) 60%, transparent); }
.ico.boon.r-legendary { color: var(--gilt-ink); border-color: var(--gilt); background: color-mix(in srgb, var(--gilt-hi) 18%, var(--leaf)); }
.ico.on { box-shadow: 0 0 0 2px color-mix(in srgb, var(--gilt) 55%, transparent); }
.ico:focus-visible { outline: 2px solid var(--lapis); outline-offset: 0; }
@media (min-width: 470px) and (min-height: 720px) { .rail { width: 34px; gap: 8px; } .ico { width: 30px; height: 30px; } .ico svg { width: 21px; height: 21px; } }

/* the Guttering Candle: a wick that burns down */
#timer { height: 4px; flex: none; background: var(--ruling); overflow: hidden; }
#timer i { display: block; height: 100%; width: 100%; transform-origin: left; background: linear-gradient(90deg, var(--vermilion), var(--gilt-hi)); }

/* ---------- Brother Bryan, the glossator ---------- */
.monk .halo { fill: color-mix(in srgb, var(--gilt) 18%, transparent); stroke: var(--gilt); stroke-width: 1.2; }
.monk .halo-rays { fill: none; stroke: var(--gilt); stroke-width: 3.4; stroke-dasharray: .8 2.6; opacity: .55; }
.monk .hood { fill: var(--lapis); }
.monk .skin { fill: var(--on-deep); }
.monk .feat { fill: none; stroke: var(--on-pale); stroke-width: 1.4; stroke-linecap: round; }

/* ---------- board ---------- */
#stage { flex: 1; min-height: 0; position: relative; display: flex; overflow: hidden; overflow: clip; }
/* an engraved rosette behind the panel, like a diagram in an alchemical text; it stays put while the board scrolls */
#rose {
  position: absolute; left: 50%; top: 50%; width: var(--rose, 300px); aspect-ratio: 1; pointer-events: none;
  translate: -50% -50%; transform: rotate(calc(var(--chaos) * 45deg));
  background: var(--rule); opacity: calc(var(--rosette) * (.33 + var(--chaos) * .67)); transition: transform 1.6s ease, width .4s ease, opacity 1.6s ease;

}
#boardWrap {
  flex: 1; min-height: 0; position: relative; display: flex;
  overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; scrollbar-width: none;
}
#boardWrap::-webkit-scrollbar { display: none; }
#board { display: grid; gap: 5px; position: relative; margin: auto; padding-block: 6px 4px; }
#board.quake1 { animation: quake 2.4s ease-in-out infinite; }
#board.quake2 { animation: quake 1.3s ease-in-out infinite; }
#board.quake3 { animation: quake .7s ease-in-out infinite; }
@keyframes quake {
  0%,100% { transform: rotate(0) translate(0,0); }
  25% { transform: rotate(-1.6deg) translate(-3px,1px); }
  50% { transform: rotate(1.2deg) translate(2px,-2px); }
  75% { transform: rotate(-.6deg) translate(1px,2px); }
}
.row { display: flex; gap: 5px; position: relative; }
#board.mirror .row { flex-direction: row-reverse; }
.row.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.tile {
  width: var(--tile); height: var(--tile); box-sizing: border-box; position: relative;
  display: grid; place-items: center;
  border: 1px solid var(--rule);
  /* a scribe's dry-point baseline in every empty cell */
  background: linear-gradient(to bottom, transparent 77%, var(--ruling) 77% calc(77% + 1px), transparent calc(77% + 1px));
  font: 400 calc(var(--tile) * .58)/1 var(--letter); text-transform: uppercase; color: var(--ink);
  padding-top: 2px;
}
.tile.filled { border: 1.5px solid var(--ink); animation: blot .28s ease-out; }
@keyframes blot { 0% { transform: scale(.94); border-color: transparent; } 60% { transform: scale(1.03); } }
.tile.ghost {
  border: 1px dashed var(--gilt); color: var(--gilt); font-style: italic;
  background: color-mix(in srgb, var(--gilt) 9%, transparent);
}
.tile.correct, .tile.present, .tile.absent, .tile.hit {
  --pig: var(--mal-fill); --on: var(--on-deep);
  background: var(--pig); border-color: var(--pig); color: var(--on);
  box-shadow: inset 0 0 0 3px var(--pig), inset 0 0 0 4px color-mix(in srgb, var(--on) 32%, transparent);
}
.tile.present { --pig: var(--orpiment); --on: var(--on-pale); }
.tile.absent {
  --pig: var(--ash); --on: var(--on-deep);
  /* engraved hatching: absent letters read as struck, even without color */
  background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--ink) 11%, transparent) 3px 4px), var(--ash);
}
.tile.hit { --pig: var(--lapis); --on: var(--on-deep); }
.tile.fog {
  background:
    radial-gradient(circle, color-mix(in srgb, var(--ink) 38%, transparent) .9px, transparent 1.4px) 0 0 / 5px 5px,
    var(--bg-deep);
  border: 1px solid color-mix(in srgb, var(--ink) 40%, transparent); color: var(--ink);
}
.tile.burn { background: transparent; border: 1px dashed var(--vermilion); color: var(--vermilion); }
/* an offering: Brother Bryan keeps the line, and it shows nothing */
.tile.due {
  background: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--gilt) 16%, transparent) 4px 5px), var(--bg-deep);
  border: 1px solid color-mix(in srgb, var(--gilt) 55%, transparent); color: var(--gilt-ink);
}
#board.still { animation: none !important; } /* the Lectern holds still while you aim */
/* pigment arrives as a bloom of wet ink, not a flip */
.tile.bloom { animation: bloom .6s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes bloom {
  0% { box-shadow: inset 0 0 0 calc(var(--tile) / 2) var(--bg), inset 0 0 0 calc(var(--tile) / 2) var(--bg); filter: blur(3px); }
  45% { filter: blur(1px); }
  100% { filter: none; }
}
.row.win .tile { animation: gild .9s ease both; }
@keyframes gild { 40% { box-shadow: inset 0 0 0 30px var(--gilt-hi); color: var(--on-pale); } }
.row.stale .tile { opacity: .55; }
.row.aim .tile { cursor: pointer; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gilt) 55%, transparent); } /* aiming the Gild */
.row.aim .tile:hover { box-shadow: inset 0 0 0 2px var(--gilt); }
.row.sketch .tile { border-style: dashed; color: var(--ink-soft); background: transparent; } /* a silverpoint sketch */
.row.faded .tile { color: transparent; background: transparent !important; border-color: var(--ruling) !important; box-shadow: none !important; transition: all 1.2s; } /* Fading Ink */
.tile.claimed, .key.claimed { background: color-mix(in srgb, var(--gilt) 14%, var(--bg-deep)) !important; border: 1px solid var(--gilt) !important; color: var(--gilt-ink) !important; box-shadow: none !important; } /* Bryan's Tithe */
.tile.claimed::before { content: ""; position: absolute; top: 3px; left: 50%; width: 14px; height: 4px; margin-left: -7px; border: 1px solid var(--gilt); border-radius: 50%; } /* a little halo */
.tile.fat::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: 9%; height: 4px; border-radius: 50%; background: var(--vermilion); filter: blur(.6px); } /* Blotted Nib */
.row.goldflash .tile { background: var(--gilt-hi) !important; border-color: var(--gilt) !important; color: var(--on-pale) !important; box-shadow: none !important; }
.row .badge { position: absolute; left: -1px; top: -3px; z-index: 2; width: clamp(11px, calc(var(--tile) * .3), 18px); height: clamp(11px, calc(var(--tile) * .3), 18px); box-sizing: border-box; padding: 1.5px; border-radius: 50%; background: var(--leaf); box-shadow: 0 0 0 1px var(--rule); }
.row .badge svg { width: 100%; height: 100%; display: block; }
.badge .droll { fill: none; stroke: var(--vermilion); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.badge .droll .f { fill: var(--vermilion); stroke: none; }
.badge .crownb path { fill: var(--gilt-hi); stroke: var(--gilt); stroke-width: 1.2; stroke-linejoin: round; }
#board.glitch { animation: glitch .6s steps(2) 2; } /* the Changeling: the ink swims */
@keyframes glitch {
  0% { transform: translate(0); filter: none; }
  25% { transform: translate(-4px, 2px) skewX(6deg); filter: blur(1.5px); }
  50% { transform: translate(5px, -1px) skewX(-8deg); filter: blur(.5px) sepia(.6); }
  75% { transform: translate(-2px, -3px); filter: blur(2px); }
}
#board.spin { animation: spin 1.1s cubic-bezier(.5,0,.3,1); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- clue log ---------- */
#log {
  flex: none; display: flex; align-items: center; gap: 8px; width: 100%; min-height: 26px;
  border: 0; border-top: 1px solid var(--ruling); background: none; padding: 5px 2px 0; cursor: pointer; text-align: left;
  font: italic 400 14.5px/1.2 var(--text); color: var(--ink-soft);
}
#log .lead { flex: none; width: 20px; height: 22px; display: grid; place-items: center; font: normal 600 16px/1 var(--text); color: var(--vermilion); }
#log .lead svg { width: 20px; height: 22px; display: block; }
#log .chips { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#log .chips b { font-weight: 500; font-style: normal; color: var(--ink); }
#log .count { flex: none; font: 400 13px/1 var(--label); letter-spacing: .04em; color: var(--lapis); font-variant-numeric: lining-nums; }

/* ---------- belt: grows as charms are found ---------- */
#belt { flex: none; display: flex; flex-wrap: wrap; gap: 5px; row-gap: 9px; justify-content: center; padding-top: 4px; padding-bottom: 4px; }
.slot {
  position: relative; flex: 1 1 0; max-width: 54px; min-width: 38px; height: 44px; box-sizing: border-box; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 6px 0 0;
  border: 1px solid var(--rule); border-radius: 50% 50% 3px 3px / 16px 16px 3px 3px;
  background: var(--leaf); color: var(--ink);
}
.slot svg { width: 22px; height: 22px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
.slot svg .fill { fill: currentColor; stroke: none; }
.slot .lbl { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 9.5px/1 var(--label); letter-spacing: .02em; color: var(--ink-soft); }
.slot .n {
  position: absolute; top: -5px; right: -4px; min-width: 17px; height: 17px; box-sizing: border-box; padding: 0 4px;
  border-radius: 52% 48% 56% 44% / 48% 55% 45% 52%; /* a blot, not a pill */
  background: var(--ink); color: var(--bg); font: 600 11.5px/17px var(--text); text-align: center; font-variant-numeric: lining-nums;
}
.slot.legend { border-color: var(--gilt); color: var(--gilt); background: color-mix(in srgb, var(--gilt) 10%, var(--leaf)); }
.slot.legend .n { background: var(--gilt-hi); color: var(--on-pale); }
.slot.empty { opacity: .42; border-style: dashed; background: transparent; }
.slot.melted .lbl { font-style: italic; }
.slot.empty .n { background: var(--ash); color: var(--on-deep); }
.slot.spent { opacity: .5; }
.slot.held { border-style: dashed; color: var(--vermilion); background: transparent; } /* Brother Bryan, held by the Drollery King */
.slot.held .n { font-variant-numeric: tabular-nums; background: var(--vermilion); color: var(--on-deep); width: auto; padding: 0 3px; }
.slot.held .lbl { color: var(--vermilion); }
.slot.dino { color: var(--ink-soft); border-style: dashed; background: transparent; } /* the Aether is down: a small wyrm sleeps here */
.slot.power { border-color: color-mix(in srgb, var(--lapis) 60%, transparent); color: var(--lapis); } /* a boon's power: renews every word */
.slot.power .lbl { color: var(--lapis); }
.slot.fly { animation: fly .5s ease; }
.slot.armed { transform: translateY(-4px); border-color: var(--gilt); color: var(--gilt-ink); background: color-mix(in srgb, var(--gilt) 16%, var(--leaf)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gilt) 40%, transparent); }
.slot.armed .lbl { color: var(--gilt-ink); }
.slot { touch-action: none; -webkit-touch-callout: none; } /* a charm can be dragged up onto the page */
.slot.lifted { opacity: .3; }
#ghost { position: fixed; z-index: 40; pointer-events: none; margin: 0; flex: none; transform: translate(-50%, -75%) scale(1.15); box-shadow: 0 12px 24px -10px var(--shadow); }
#ghost.ready { border-color: var(--gilt); color: var(--gilt-ink); background: color-mix(in srgb, var(--gilt) 20%, var(--leaf)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gilt) 45%, transparent), 0 12px 24px -10px var(--shadow); }
#ghost.ready .lbl { color: var(--gilt-ink); }
@keyframes fly { 40% { transform: translateY(-8px); } }
.slot svg { width: 20px; height: 20px; }
@media (max-width: 370px) { .slot .lbl { font-size: 8px; letter-spacing: 0; text-overflow: clip; } #belt { gap: 4px; } }
@media (min-width: 470px) and (min-height: 720px) { .slot { height: 52px; } .slot svg { width: 22px; height: 22px; } }

/* ---------- keyboard: the type case ---------- */
#kb { flex: none; display: flex; flex-direction: column; gap: 6px; padding-bottom: 2px; }
@media (max-width: 400px) { #kb { margin-inline: -12px; } .kr { gap: 3px; } }
@media (max-width: 339px) { .key.wide { font-size: 11px; letter-spacing: 0; } }
.kr { display: flex; gap: 4px; justify-content: center; }
.key {
  flex: 1 1 0; max-width: 42px; height: 46px; padding: 0; cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--rule) 70%, transparent); border-radius: 3px;
  background: var(--key); color: var(--ink);
  font: 400 21px/1 var(--letter); text-transform: uppercase;
  box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--ink) 10%, transparent);
  overflow: hidden;
}
.key[data-k="q"] { text-indent: -7px; } /* Fell's Q has a long tail */
.key.wide { flex: 1.75 1 0; max-width: 66px; font: 400 12.5px/1 var(--label); letter-spacing: .02em; text-transform: none; }
.key.wide svg { width: 22px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.key.correct { background: var(--mal-fill); border-color: var(--mal-fill); color: var(--on-deep); }
.key.present { background: var(--orpiment); border-color: var(--orpiment); color: var(--on-pale); }
.key.absent {
  background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--ink) 10%, transparent) 3px 4px), var(--ash);
  border-color: var(--ash); color: var(--on-deep);
}
.key.hit { background: var(--lapis); border-color: var(--lapis); color: var(--on-deep); }
.key.glow { box-shadow: 0 0 0 2px var(--gilt-hi), 0 0 14px var(--gilt); } /* Vowel Lamps */
.key:focus-visible, button:focus-visible, .card:focus-visible { outline: 2px solid var(--lapis); outline-offset: 2px; }

/* ---------- toasts and events ---------- */
#toast {
  position: fixed; left: 50%; bottom: 30%; transform: translateX(-50%); z-index: 30; max-width: calc(100% - 48px); width: max-content; box-sizing: border-box;
  background: var(--leaf); color: var(--ink); border: 1px solid var(--ink-soft); padding: 8px 16px; text-align: center;
  font: italic 400 16px/1.3 var(--text); box-shadow: 0 14px 30px -14px var(--shadow); pointer-events: none;
}
#toast.act { pointer-events: auto; display: flex; gap: 12px; align-items: center; text-align: left; }
/* ---------- notes: a game word ruled in dotted gilt; hover or tap it for a note in the margin ---------- */
.kw {
  pointer-events: auto; cursor: pointer; border-radius: 2px;
  text-decoration: underline dotted color-mix(in srgb, var(--gilt) 85%, transparent);
  text-decoration-thickness: 1.5px; text-underline-offset: .2em; text-decoration-skip-ink: none;
}
.kw.on { text-decoration-style: solid; text-decoration-color: var(--gilt); background: color-mix(in srgb, var(--gilt-hi) 24%, transparent); }
#hRound, #hSeals, .row .badge { cursor: pointer; }
@media (hover: hover) and (pointer: fine) { .kw, #hRound, #hSeals, .row .badge { cursor: help; } .kw:hover { text-decoration-style: solid; text-decoration-color: var(--gilt); } }
.kw:focus-visible { outline: 2px solid var(--lapis); outline-offset: 1px; }
#tip {
  position: fixed; left: 0; top: 0; z-index: 45; box-sizing: border-box; width: max-content; max-width: min(280px, calc(100vw - 16px));
  background: var(--leaf); color: var(--ink); border: 1px solid var(--gilt); padding: 7px 11px 8px;
  box-shadow: inset 0 0 0 2px var(--leaf), inset 0 0 0 3px color-mix(in srgb, var(--gilt) 30%, transparent), 0 12px 26px -12px var(--shadow);
  font: normal 400 15px/1.3 var(--text); letter-spacing: 0; text-align: left;
  pointer-events: none; animation: tipIn .14s ease-out;
}
#tip.pin { pointer-events: auto; }
#tip b { display: block; margin-bottom: 3px; font: 400 12.5px/1.15 var(--label); letter-spacing: .07em; color: var(--gilt-ink); }
#tip b i { font-style: normal; color: var(--ink-soft); }
#tip b i::before { content: " · "; }
#tip::after { content: ""; position: absolute; left: var(--ax, 50%); width: 8px; height: 8px; margin-left: -5px; background: var(--leaf); border: 0 solid var(--gilt); transform: rotate(45deg); }
#tip.up::after { bottom: -5px; border-width: 0 1px 1px 0; }
#tip.down::after { top: -5px; border-width: 1px 0 0 1px; }
#tip.side-l::after, #tip.side-r::after { top: var(--ay, 50%); margin: -5px 0 0; }
#tip.side-l::after { left: -5px; border-width: 0 0 1px 1px; }
#tip.side-r::after { left: auto; right: -5px; border-width: 1px 1px 0 0; }
@keyframes tipIn { from { opacity: 0; } }
#toast button { flex: none; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); font: 600 14px/1 var(--display); letter-spacing: .05em; padding: 7px 11px; cursor: pointer; }
#event { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); z-index: 31; pointer-events: none; display: grid; gap: 4px; justify-items: center; text-align: center; width: max-content; max-width: calc(100% - 32px); }
#event b { font: 600 34px/1 var(--display); color: var(--gilt); text-shadow: 0 0 18px var(--bg), 0 0 4px var(--bg), 0 0 2px var(--bg); text-wrap: balance; }
#event.bad b { color: var(--vermilion); }
#event span { font: italic 400 16px/1.3 var(--text); color: var(--ink); background: var(--leaf); border: 1px solid var(--rule); padding: 3px 10px; }
#event.show { animation: inkEvent 2.2s ease-out both; }
@keyframes inkEvent { 0% { opacity: 0; filter: blur(8px); transform: translateX(-50%) scale(1.15); } 15% { opacity: 1; filter: blur(0); transform: translateX(-50%) scale(1); } 85% { opacity: 1; } 100% { opacity: 0; filter: blur(4px); transform: translateX(-50%); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 25; }
.shakeall { animation: quake .3s linear 1; }

/* ---------- modal: a loose leaf laid over the page ---------- */
#modal {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px;
  background: var(--veil); backdrop-filter: blur(2px);
}
.panel {
  width: 100%; max-width: 420px; box-sizing: border-box; max-height: calc(100% - 16px); overflow-y: auto;
  background: var(--leaf); color: var(--ink); padding: 22px 20px 18px;
  border: 1px solid var(--ink-soft);
  display: flex; flex-direction: column; gap: 14px; position: relative;
  box-shadow: inset 0 0 0 5px var(--leaf), inset 0 0 0 6px var(--rule), 0 24px 60px -20px var(--shadow);
  animation: rise .35s ease-out;
}
@keyframes rise { from { transform: translateY(10px); opacity: 0; } }
#panel:focus { outline: none; }
.panel .eyebrow, .eyebrow { font: 400 12.5px/1.2 var(--label); letter-spacing: .1em; color: var(--vermilion); text-align: center; }
.panel h2 { font: 600 31px/1.05 var(--display); letter-spacing: .02em; margin: -4px 0 0; text-align: center; text-wrap: balance; }
.panel h2.chaos { color: var(--vermilion); }
.panel h2.bless { color: var(--gilt-ink); }
.panel p { margin: 0; line-height: 1.4; color: var(--ink-soft); }
.panel p strong { color: var(--ink); font-weight: 600; }
.panel .lede { text-align: center; font-style: italic; }
.word { display: flex; gap: 4px; justify-content: center; }
.word span {
  width: 36px; height: 36px; display: grid; place-items: center; padding-top: 2px; box-sizing: border-box;
  background: var(--mal-fill); color: var(--on-deep); font: 400 22px/1 var(--letter); text-transform: uppercase;
  box-shadow: inset 0 0 0 3px var(--malachite), inset 0 0 0 4px color-mix(in srgb, var(--on-deep) 32%, transparent);
}
.word.lost span { background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--ink) 11%, transparent) 3px 4px), var(--ash); box-shadow: inset 0 0 0 3px var(--ash), inset 0 0 0 4px color-mix(in srgb, var(--on-deep) 32%, transparent); }
.cards { display: grid; gap: 10px; }
/* spoils: two small chips, one tap */
#panel .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 6px 0 4px; }
.chip {
  display: grid; justify-items: center; gap: 3px; padding: 10px 6px 9px; cursor: pointer; font: inherit; color: var(--ink);
  background: transparent; border: 1px solid var(--rule); animation: deal .5s both cubic-bezier(.2, .8, .3, 1);
}
.chip:hover, .chip:focus-visible { border-color: var(--gilt); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--gilt) 35%, transparent); outline: none; }
.chip .glyph svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.chip .glyph svg .fill { fill: currentColor; stroke: none; }
.chip b { font: 600 17px/1.1 var(--display); letter-spacing: .03em; text-align: center; }
.chip span { font: 400 11.5px/1.2 var(--label); letter-spacing: .06em; color: var(--ink-soft); }
.card {
  display: block; width: 100%; box-sizing: border-box; text-align: left; cursor: pointer; font: inherit; color: var(--ink);
  background: transparent; border: 1px solid var(--rule); padding: 11px 13px 12px; position: relative;
  animation: deal .5s both cubic-bezier(.2, .8, .3, 1);
}
.card::after { content: ""; display: table; clear: both; }
@keyframes deal { from { opacity: 0; transform: translateY(8px); filter: blur(2px); } }
.card .tier { display: block; font: 400 11.5px/1 var(--label); letter-spacing: .08em; color: var(--ink-soft); margin: 2px 0 5px; }
.card b { display: block; font: 600 21px/1.1 var(--display); letter-spacing: .03em; }
/* a card's picture (charm, boon or curse), floated beside its text */
.card .cap {
  float: left; width: 50px; height: 54px; box-sizing: border-box; margin: 1px 12px 2px 0;
  display: grid; place-items: center; padding-top: 3px;
  border: 1px solid var(--ink); box-shadow: inset 0 0 0 2px var(--leaf), inset 0 0 0 3px color-mix(in srgb, var(--ink) 35%, transparent);
}
.card .cap.glyph svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
.card .cap.glyph svg .fill { fill: currentColor; stroke: none; }
.card > span:not(.tier):not(.cap) { display: block; font: 400 15px/1.3 var(--text); color: var(--ink-soft); margin-top: 3px; }
.card.r-rare { border-color: var(--lapis); box-shadow: inset 0 0 0 3px var(--leaf), inset 0 0 0 4px color-mix(in srgb, var(--lapis) 45%, transparent); }
.card.r-rare .tier { color: var(--lapis); }
.card.r-rare .cap { background: var(--lapis); color: var(--on-deep); border-color: var(--lapis); box-shadow: inset 0 0 0 2px var(--lapis), inset 0 0 0 3px color-mix(in srgb, var(--on-deep) 40%, transparent); }
.card.r-legendary {
  border-color: var(--gilt);
  background: linear-gradient(160deg, color-mix(in srgb, var(--gilt-hi) 22%, transparent), transparent 60%);
  box-shadow: inset 0 0 0 3px var(--leaf), inset 0 0 0 4px var(--gilt);
}
.card.r-legendary .tier { color: var(--gilt-ink); }
.card.r-legendary .cap {
  color: var(--on-pale); border-color: var(--gilt);
  background: linear-gradient(135deg, var(--gilt-hi), color-mix(in srgb, var(--gilt-hi) 55%, var(--gilt)) 55%, var(--gilt-hi));
  box-shadow: inset 0 0 0 2px transparent, inset 0 0 0 3px color-mix(in srgb, var(--on-pale) 30%, transparent);
}
.card.r-legendary::before, .card.r-legendary .lz { /* gilt lozenges at two corners */
  content: ""; position: absolute; width: 7px; height: 7px; background: var(--gilt); transform: rotate(45deg);
}
.card.r-legendary::before { top: -4px; right: 18px; }
.card.r-legendary .lz { bottom: -4px; left: 18px; }
.card:hover { border-color: var(--ink); }
.card.curse { cursor: default; border-color: color-mix(in srgb, var(--vermilion) 70%, transparent); }
.card.curse b { color: var(--vermilion); }
.card.curse .tier { color: var(--vermilion); }
.card.curse .cap { color: var(--vermilion); border-color: var(--vermilion); box-shadow: inset 0 0 0 2px var(--leaf), inset 0 0 0 3px color-mix(in srgb, var(--vermilion) 35%, transparent); }
.card.curse.pick { cursor: pointer; }
.card.curse.pick:hover { border-color: var(--vermilion); }
.card.sel { outline: 2px solid var(--gilt); outline-offset: 2px; border-color: var(--gilt); }
.card.curse.sel { outline-color: var(--vermilion); border-color: var(--vermilion); }
.card .again {
  position: absolute; top: -9px; right: 12px; padding: 0 6px; background: var(--leaf); white-space: nowrap;
  font: 400 11.5px/17px var(--label); letter-spacing: .08em; font-style: normal; color: var(--gilt-ink);
  animation: again .25s both ease-out;
}
.card.r-legendary .again { right: 32px; }
.card.curse .again { color: var(--vermilion); }
@keyframes again { from { opacity: 0; transform: translateY(3px); } }
.btn {
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer;

<script>
(() => {
'use strict';
// ---------- word data ----------
const LENGTHS = [5]; // every Word is five letters (the build ships only these lists)
const VALID = {}, ANSWERS = {};
for (const L of LENGTHS) {
  const w = window.WORDS[L], set = new Set();
  for (let i = 0; i < w.valid.length; i += L) set.add(w.valid.slice(i, i + L));
  ANSWERS[L] = w.answers.split(' ');
  ANSWERS[L].forEach(x => set.add(x));
  VALID[L] = set;
}
const CLUES = window.CLUES || {};
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const NUMW = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const pluralW = (n, w) => `${NUMW[n] || n} ${w}${n === 1 ? '' : 's'}`;
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

const BRYAN_CLUE = { pos: 'noun', form: 'proper', lex: 'saints', cat: 'legend', def: 'the Word, always (disputed)', ex: "'Is it ____?' 'It is always ____.'", syn: ['the guy'], rhy: ['lion', 'scion'], syl: 2, str: 'DA-da' };

// leak guard: no clue may show the answer, its stem, or a word that starts like it
for (const [w, c] of Object.entries(CLUES)) {
  if (w.length < 4) continue;
  const pre = w.length >= 5 ? w.slice(0, 4) : w;
  const leak = new RegExp(`\\b${pre}[a-z]*|[a-z]*${w}[a-z]*`, 'gi');
  const leaks = s => typeof s === 'string' && (leak.lastIndex = 0, leak.test(s));
  if (typeof c.def === 'string') c.def = c.def.replace(leak, '…');
  if (typeof c.ex === 'string') { const parts = c.ex.split('____'); c.ex = parts.map(p => p.replace(leak, '…')).join('____'); }
  for (const k of ['cat', 'opp', 'lex']) if (leaks(c[k])) delete c[k];

// a last guard on top of the cleaned word lists: keep names out of the answer pools
const NAMEY = new Set(['paul', 'drew', 'smith', 'louis', 'paris', 'jones', 'lewis', 'kelly', 'mason', 'john', 'mary', 'york', 'jesus']);
for (const L of LENGTHS) ANSWERS[L] = ANSWERS[L].filter(w => !NAMEY.has(w) && !/\((born |\d{4}-\d{4})/.test((CLUES[w] || {}).def || ''));
// book pools: answers are in frequency order, so early books draw from the common end
const POOLS = { 1: { 5: ANSWERS[5].slice(0, 600) }, 2: { 5: ANSWERS[5].slice(0, 1200) } };
const BRYAN_FORMS = { 5: 'bryan' };
const bryanForm = L => BRYAN_FORMS[L];
// the Feast of St. Bryan picks a word that shares most of his letters, from the pool that round uses
let ADJACENT = POOLS[2][5].filter(w => w !== 'randy' && w !== 'bryan' && new Set([...w].filter(c => 'bryan'.includes(c))).size >= 4);
if (!ADJACENT.length) ADJACENT = POOLS[2][5].filter(w => new Set([...w].filter(c => 'bryan'.includes(c))).size >= 3).slice(0, 20);
if (!ADJACENT.length) ADJACENT = ['brain'];

// ---------- curses ----------
const CURSES = {
  fuse:     { name: 'Torn Leaf',         tier: 'mild',   max: 3, desc: n => `The page is torn: ${pluralW(n, 'line')} fewer per word.` },

  clock:    { name: 'Guttering Candle',  tier: 'mild',   max: 3, desc: n => `Your candle burns while you think: ${clockSecs(n)} seconds a line, or the line burns.` },
  quake:    { name: 'Quaking Lectern',   tier: 'mild',   max: 3, desc: n => n > 1 ? `The lectern shakes harder (level ${n}).` : 'The page will not sit still.' },

  property: { name: "Bryan's Tithe",     tier: 'medium', max: 1, desc: () => 'B, R, Y, A and N are tithed to Bryan. Write BRYAN to free them for the word.' },
  rule:     { name: "The Abbot's Rule",  tier: 'medium', max: 1, desc: () => 'Every green must stay where it was found and every gold must be written again, or the line is refused. BRYAN is always allowed.' },
  liar:     { name: 'The Lying Scribe',  tier: 'nasty',  max: 1, desc: () => 'One tile in every unsolved line is painted the wrong pigment.' },

};
const TIER_NAME = { mild: 'Minor', medium: 'Major', nasty: 'Grave' };
const clockSecs = n => Math.max(15, 50 - 12 * (n - 1)) * (S && has('iron') ? 2 : 1);

// ---------- boons ----------
const PERKS = {
  // the folio 2 styles: dealt on folio 2 and nowhere else

  gilt:      { name: 'Gilt Edge',        rarity: 'common', max: 1, needs: ['hint'], desc: 'Your Gild may seek a letter instead of a square: if it is in the Word it is gilded where it sits; if not, it is struck.' },
  chorus:    { name: 'Chorus of the Dead', rarity: 'rare', max: 1, ok: () => S.bryanState !== 'kidnapped', desc: "Bryan's first answer on each word calls up two spirits: two clues for the price of one." },
  hints:     { name: "Seller's Token",   rarity: 'common', max: 1, needs: ['hint'], desc: 'Once a word, buy a Gild from the Relic Seller for a line of your next page.' },
  licence:   { name: "Scribe's Licence", rarity: 'common', max: 1, from: 3, desc: 'Your first line on each word need not be a word.' },
  steady:    { name: 'Steady Quill',     rarity: 'common', max: 1, counter: ['fat', 'quake'], desc: 'The Blotted Nib and the Quaking Lectern stop working on you.' },
  iron:      { name: 'Slow Wick',        rarity: 'common', max: 1, counter: ['clock'], desc: 'The Guttering Candle burns half as fast.' },
  guess:     { name: 'Wide Margins',     rarity: 'rare', max: 1, ok: () => !!has('abc') && !!has('mulligan'), desc: 'Your margins hold two extra lines, not one.' },
  beater:    { name: "Gold-Beater's Hammer", rarity: 'rare', max: 1, needs: ['hint'], desc: 'Gild twice a word, and your Gild niche holds three.' },
  concord:   { name: 'Concordance',      rarity: 'rare', max: 1, needs: ['dict'], desc: 'Read the Index before your first line and it reads both the vowels and the consonants.' },
  candle:    { name: 'Fine Candle',      rarity: 'rare', max: 1, needs: ['source'], desc: 'Your sketches also show which of their letters sit in place.' },
  abacus:    { name: 'Abacus',           rarity: 'rare', max: 1, needs: ['bot'], desc: 'The gloss line counts the words that still fit, on every word.' },

  piggy:     { name: 'Alms Box',         rarity: 'rare', max: 1, desc: 'Solve with two lines or more to spare and the box keeps one. Run out of lines on a later word and it pays it out.' },

  phoenix:   { name: 'Phoenix Quill',    rarity: 'legendary', max: 1, ok: () => !S.quillBurned, desc: 'The first time you run out of lines, write two more. Then the quill burns.' },
  vowels:    { name: 'Vowel Lamps',      rarity: 'legendary', max: 1, desc: "After your first line on each word, the Word's vowels glow in the type case." },
  pact:      { name: 'The Red-Ink Pact', rarity: 'legendary', instant: true, ok: () => S.round >= 5 && S.lives < 2 && S.curses.length <= 4, desc: 'Gain two seals now. Take two extra curses next folio.' },
  oracle:    { name: 'Foresight',        rarity: 'legendary', max: 1, needs: ['hint'], desc: 'Every word starts with one letter already gilded. Your Gild is melted down to pay for it, with any boon that serves it.' },
};
const RARITY = { common: '', rare: 'Rare', legendary: 'Legendary' };
// rares from folio 3 and legendaries from folio 10 (the feast-day reward ignores this)
const fromOf = id => PERKS[id].from || ({ common: 1, rare: 3, legendary: 10 })[PERKS[id].rarity];

// ---------- charms (power-up items) ----------
// a book starts with the Gild and Brother Bryan; the others are found in the armarium (or a boon offer) and join the belt.
// `from` is the first folio a charm can be found; spoils only ever deal charms you have found. `w` weighs a charm in the spoils
const ITEMS = {

  chat:   { name: 'Brother Bryan',       short: 'Bryan',      tag: 'Bryan',      cap: 2, w: 0, from: 1, net: true, desc: 'Ask Brother Bryan for the next clue. Each answer costs a favour; offer him a BRYAN line to earn one.' },
  row:    { name: 'Palimpsest',          short: 'Palimpsest', tag: 'Borrow',     cap: 1, w: 5, from: 3, desc: "Scrape tomorrow's vellum: one more line now, one fewer on the next word." },
  dict:   { name: 'The Index',           short: 'Index',      tag: 'Index',      cap: 1, w: 6, from: 3, desc: 'Read the vowels (every vowel the Word forbids is struck) or the consonants (five it forbids are struck).' },
  source: { name: 'Underdrawing',        short: 'Underdraw',  tag: 'Sketch',     cap: 1, w: 6, from: 3, net: true, desc: 'Sketch a word in silverpoint: it tells how many of its letters sit in place and how many elsewhere, never which. No line spent.' },
  bot:    { name: 'The Brazen Head',     short: 'Head',       tag: 'Head',       cap: 1, w: 6, from: 3, net: true, desc: 'Type a line, then ask: it counts the words that still fit and judges what your line would leave.' },
  tamper: { name: "Heretic's Hourglass", short: 'Hourglass',  tag: 'Glass',      cap: 1, w: 3, from: 6, desc: 'Swap the Word for a new one. Your last three lines still count.' },
  gooble: { name: 'The Googol',          short: 'Googol',     tag: 'Googol',     cap: 1, w: 1, from: 11, net: true, legend: true, desc: "Ask the oracle: the Word's bones, or what it means. Or spin for both." },
  holy:   { name: 'Holy Water',          short: 'Holy Water', tag: 'Holy',       cap: 1, w: 3, from: 6, desc: "Your curses sleep for this word. A beast's do not, and a drollery's line already written stays." },
  ordeal: { name: 'The Ordeal',          short: 'Ordeal',     tag: 'Ordeal',     cap: 1, w: 3, from: 6, desc: 'Stake it before your first line: solve with two lines to spare and cast out any curse; fail and take a Major one.' },
};
const ITEM_ORDER = Object.keys(ITEMS);
const capOf = id => ITEMS[id].cap + (id === 'hint' && has('beater') ? 1 : 0) + (id === 'chat' && has('bryanBless') ? 1 : 0);

// the belt holds five charges in all (Bryan's favours sit outside it); you keep six lasting boons; his ransom is six BRYANs
const BELT_CAP = 5, BOON_CAP = 6, RANSOM = 6;
const beltTotal = () => ITEM_ORDER.reduce((a, id) => a + (id === 'chat' ? 0 : S.items[id] || 0), 0);
const boonIds = () => Object.keys(S.perks).filter(id => S.perks[id] && PERKS[id] && !PERKS[id].instant && !PERKS[id].niche && !PERKS[id].spoil);
// one line each; the limits are told when you meet them
const descOf = id => {
  const bf = bryanForm(S.len), form = (bf || 'bryan').toUpperCase(), tmrw = bossOf(S.round + 1) ? ` Tomorrow is ${beastPage(S.round + 1)}.` : '';
  if (id === 'chat') return `Ask Brother Bryan for the next clue. Each answer costs a favour; ${bf ? `offer him a ${form} line to earn one.` : 'BRYAN does not fit this page.'}`;
  if (id === 'ordeal') return `Stake it before your first line: solve with ${has('dice') ? 'one line' : 'two lines'} to spare and cast out any curse; fail and take a Major one.`;
  if (id === 'tamper') return `Swap the Word for a new one. Your last ${has('dice') ? 'four' : 'three'} lines still count.`;
  if (id === 'row') return ITEMS.row.desc + tmrw;
  return ITEMS[id].desc;
};
const isOpen = id => !S.open || S.open.includes(id);
const isLive = id => isOpen(id) && !(id === 'hint' && S.melted); // a Gild melted for Foresight keeps its slot, empty
// no line of your own that shows pigments yet (an offering to Bryan is not a probe)
const noProbe = () => !S.rows.some(r => r.by === 'player' && !r.offered);
// the armarium opens at folios 3, 6 and 11, then every fifth folio
const isArmarium = r => r === 3 || r === 6 || r === 11 || (r >= 16 && r % 5 === 1);
// a charm you haven't found can turn up in a boon offer: one generated card per charm
const NICHE_RARITY = { tamper: 'rare', ordeal: 'rare', gooble: 'legendary' };
for (const id of ITEM_ORDER) if (id !== 'hint' && id !== 'chat') PERKS['rel_' + id] = {
  name: ITEMS[id].name, rarity: NICHE_RARITY[id] || 'common', instant: true, niche: id,
  ok: () => !isOpen(id) && S.round >= ITEMS[id].from,
  desc: ITEMS[id].desc,
};
// spoils: on a folio with no boon, a solved word deals two of these, one charge each from charms you have found
for (const id of ITEM_ORDER) if (id !== 'chat') PERKS['sp_' + id] = {
  name: ITEMS[id].name, rarity: 'common', instant: true, spoil: id,
  ok: () => isLive(id) && (S.items[id] || 0) < capOf(id) && beltTotal() < BELT_CAP,
  desc: '+1 charge. ' + ITEMS[id].desc,
};
const G = p => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;

  const greyOk = (r, ch) => r.letters.every((x, j) => x !== ch || rank[r.shown[j]]);

}

  const quake = count('quake') && !matchMedia('(prefers-reduced-motion: reduce)').matches ? 8 : 0;
  const side = Math.max(30, $('railB').offsetWidth) + quake, w = wrap.clientWidth - 2 * side, h = wrap.clientHeight - 10;
  const t = Math.max(20, Math.floor(Math.min(62, (w - gap * (S.len - 1)) / S.len, (h - gap * (rows - 1)) / rows)));
  document.documentElement.style.setProperty('--tile', t + 'px');
  // the rosette sits behind the board, a little larger than it, never larger than the stage
  const bw = S.len * t + gap * (S.len - 1), bh = rows * t + gap * (rows - 1);
